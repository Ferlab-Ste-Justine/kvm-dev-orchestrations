apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres.ferlab.lan/keycloak"
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              value: keycloak
            - name: KC_HOSTNAME
              value: http://keycloak.k8.ferlab.lan
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: JDBC_PARAMS
              value: 'sslmode=verify-full&sslrootcert=/etc/keycloak/tls/postgres/postgres_ca.crt'
            - name: KC_FEATURES
              value: "client-secret-rotation"
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/keycloak/tls/postgres
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: postgres-ca
            defaultMode: 0440